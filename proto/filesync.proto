syntax = "proto3";
option go_package = "github.com/TypeTerrors/go_sync/proto;filesync";

// Protocol v2 deliberately does not accept the unsafe v1 push RPCs.
service FileSyncService {
  rpc ListFiles(Empty) returns (FileList);
  rpc ReadFile(FileEntry) returns (stream FileChunk);
  rpc ReadDelta(stream DeltaRequest) returns (stream FileChunk);
  rpc HealthCheck(stream Ping) returns (stream Pong);
}
message Empty { repeated string known_paths = 1; }
message Ping { string message = 1; }
message Pong { string message = 1; }
// (revision, origin) is a deterministic total order, independent of wall clocks.
message FileEntry {
  string file_name = 1;
  int64 file_size = 2;
  uint64 revision = 3;
  bool is_deleted = 4;
  string hash = 5;
  string origin = 6;
  uint32 mode = 7;
  bool is_directory = 8;
  map<string, uint64> version = 9;
}
message FileList { repeated FileEntry files = 1; }
message FileChunk { bytes chunk_data = 1; int64 offset = 2; }

// The first request names a bounded file revision and block size. Subsequent
// requests contain only batches of local basis hashes; CloseSend ends the list.
message DeltaRequest {
  FileEntry file = 1;
  int64 block_size = 2;
  repeated ChunkHash basis = 3;
}
message ChunkHash { int64 offset = 1; bytes hash = 2; }
