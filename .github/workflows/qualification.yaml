name: Extended Docker qualification
on:
  workflow_dispatch:
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - run: make qualification
      - run: make dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-reports
          path: |
            /tmp/gosync-regression-*/results.json
            /tmp/gosync-regression-*/compose.log
            /tmp/gosync-startup-*/results.json
            /tmp/gosync-startup-*/compose.log
            /tmp/gosync-operations-*/results.json
            /tmp/gosync-operations-*/compose.log
            /tmp/gosync-mesh-*/results.json
            /tmp/gosync-mesh-*/compose.log
            /tmp/gosync-faults-*/results.json
            /tmp/gosync-faults-*/compose.log
