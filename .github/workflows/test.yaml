name: Regression tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - run: make test
      - run: make integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: /tmp/gosync-regression-*/
