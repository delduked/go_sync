name: Tag merges and publish releases

on:
  pull_request_target:
    types: [closed]

# The target event also covers merged fork PRs. Only the metadata-only jobs get
# write access; merged code is built separately with a read-only token.
permissions: {}

concurrency:
  group: merge-release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  tag:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.merge.outputs.tag }}
      sha: ${{ steps.merge.outputs.sha }}
      publish: ${{ steps.merge.outputs.publish }}
    steps:
      - name: Tag the exact merged commit
        id: merge
        uses: actions/github-script@v7
        with:
          script: |
            const pull = context.payload.pull_request;
            if (context.payload.action !== 'closed' || pull?.merged !== true) {
              core.setOutput('publish', 'false');
              return;
            }
            const sha = pull.merge_commit_sha;
            if (!/^[a-f0-9]{40}$/.test(sha) || !Number.isSafeInteger(pull.number) || pull.number < 1) {
              throw new Error('Missing or invalid merged PR identity');
            }
            const tag = `merge-${pull.number}-${sha.slice(0, 12)}`;
            let existing;
            try {
              existing = (await github.rest.git.getRef({...context.repo, ref: `tags/${tag}`})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (existing) {
              if (existing.object.type !== 'commit' || existing.object.sha !== sha) {
                throw new Error(`Refusing to move existing tag ${tag}`);
              }
            } else {
              await github.rest.git.createRef({...context.repo, ref: `refs/tags/${tag}`, sha});
            }
            core.setOutput('tag', tag);
            core.setOutput('sha', sha);
            core.setOutput('publish', pull.base.ref === context.payload.repository.default_branch ? 'true' : 'false');
            core.notice(`Tagged merged PR #${pull.number}: ${tag} -> ${sha}`);

  build:
    needs: tag
    if: needs.tag.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the tagged merge, not a moving branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Test release workflow behavior
        run: node --test scripts/release-workflow.test.cjs
      - name: Run race tests and static analysis
        run: |
          make test
          go vet ./...
      - name: Verify three-peer synchronization
        run: make integration
      - name: Build all six platform binaries
        run: make dist
      - name: Generate download checksums
        working-directory: dist
        run: sha256sum gosync-* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.tag.outputs.tag }}
          path: |
            dist/gosync-*
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [tag, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # No checkout or execution of repository code in this privileged job.
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.tag.outputs.tag }}
          path: dist
      - name: Publish a complete release from the merge tag
        id: publish
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.tag.outputs.tag }}
          RELEASE_SHA: ${{ needs.tag.outputs.sha }}
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const pull = context.payload.pull_request;
            const tag = process.env.RELEASE_TAG;
            const sha = process.env.RELEASE_SHA;
            if (context.payload.action !== 'closed' || pull?.merged !== true ||
                pull.base.ref !== context.payload.repository.default_branch ||
                !/^[a-f0-9]{40}$/.test(sha) || sha !== pull.merge_commit_sha ||
                tag !== `merge-${pull.number}-${sha.slice(0, 12)}`) {
              throw new Error('Only the tagged default-branch merge can become a release');
            }
            const ref = (await github.rest.git.getRef({...context.repo, ref: `tags/${tag}`})).data;
            if (ref.object.type !== 'commit' || ref.object.sha !== sha) {
              throw new Error(`Tag ${tag} no longer points to the expected merge`);
            }
            const binaries = [
              'gosync-darwin-amd64', 'gosync-darwin-arm64',
              'gosync-linux-amd64', 'gosync-linux-arm64',
              'gosync-windows-amd64.exe', 'gosync-windows-arm64.exe',
            ];
            const names = [...binaries, 'SHA256SUMS'].sort();
            if (JSON.stringify(fs.readdirSync('dist').sort()) !== JSON.stringify(names)) {
              throw new Error('Release artifact must contain exactly six binaries and SHA256SUMS');
            }
            const files = new Map(names.map(name => {
              if (!fs.lstatSync(`dist/${name}`).isFile()) throw new Error(`Not a regular file: ${name}`);
              const data = fs.readFileSync(`dist/${name}`);
              if (!data.length) throw new Error(`Empty release file: ${name}`);
              return [name, data];
            }));
            const sums = new Map();
            for (const line of files.get('SHA256SUMS').toString('utf8').trim().split('\n')) {
              const match = /^([a-f0-9]{64})  (gosync-[a-z0-9.-]+)$/.exec(line);
              if (!match || !binaries.includes(match[2]) || sums.has(match[2])) {
                throw new Error('Invalid or duplicate checksum entry');
              }
              sums.set(match[2], match[1]);
            }
            for (const name of binaries) {
              const actual = crypto.createHash('sha256').update(files.get(name)).digest('hex');
              if (sums.get(name) !== actual) throw new Error(`Checksum mismatch: ${name}`);
            }
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({...context.repo, tag})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (!release) {
              // The by-tag endpoint is documented for published releases. Find
              // an interrupted draft through the authenticated release listing.
              const releases = await github.paginate(github.rest.repos.listReleases, {
                ...context.repo, per_page: 100,
              });
              release = releases.find(candidate => candidate.tag_name === tag);
            }
            if (!release) {
              release = (await github.rest.repos.createRelease({
                ...context.repo, tag_name: tag, target_commitish: sha,
                name: `GoSync ${tag}`, draft: true, prerelease: false,
                generate_release_notes: true,
                body: `Automatic build of merged PR #${pull.number}.\n\n` +
                  'Downloads cover Linux, macOS (darwin), and Windows on amd64 and arm64. ' +
                  'SHA256SUMS contains the download checksums. Linux has native runtime coverage; ' +
                  'macOS and Windows binaries are cross-compiled and still need native runtime validation.\n\n',
              })).data;
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...context.repo, release_id: release.id, per_page: 100,
            });
            if (!release.draft) {
              if (JSON.stringify(assets.map(asset => asset.name).sort()) !== JSON.stringify(names) ||
                  assets.some(asset => asset.state !== 'uploaded' || asset.size <= 0)) {
                throw new Error('Published release is incomplete; refusing to overwrite public assets');
              }
              core.notice(`Release already published; left unchanged: ${release.html_url}`);
              return;
            }
            if (assets.some(asset => !names.includes(asset.name))) {
              throw new Error('Draft contains unexpected assets; refusing to replace it');
            }
            // A failed upload leaves a draft. A rerun replaces its assets before publication.
            for (const name of names) {
              const existing = assets.find(asset => asset.name === name);
              if (existing) {
                await github.rest.repos.deleteReleaseAsset({...context.repo, asset_id: existing.id});
              }
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo, release_id: release.id, name, data: files.get(name),
                headers: {'content-type': name === 'SHA256SUMS' ? 'text/plain' : 'application/octet-stream'},
              });
            }
            const published = (await github.rest.repos.updateRelease({
              ...context.repo, release_id: release.id, draft: false, make_latest: 'legacy',
            })).data;
            core.notice(`Published ${published.html_url}`);
