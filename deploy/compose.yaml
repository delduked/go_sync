services:
  gosync:
    image: gosync:local
    build: ..
    user: "${GOSYNC_UID:-1000}:${GOSYNC_GID:-1000}"
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 20s
    command:
      - --config=/config/peer.json
      - --sync-folder=/files
      - --state-dir=/state
      - --tls-ca=/identity/ca.pem
      - --tls-cert=/identity/peer.pem
      - --tls-key=/identity/peer-key.pem
    volumes:
      - "${GOSYNC_CONFIG:?set GOSYNC_CONFIG}:/config/peer.json:ro"
      - "${GOSYNC_IDENTITY:?set GOSYNC_IDENTITY}:/identity:ro"
      - "${GOSYNC_FILES:?set GOSYNC_FILES}:/files"
      - "${GOSYNC_STATE:?set GOSYNC_STATE}:/state"
